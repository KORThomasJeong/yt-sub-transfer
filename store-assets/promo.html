<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 440px; height: 280px; overflow: hidden; }
  body {
    font-family: "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, #d40000 0%, #a30000 100%);
    color: #fff; display: flex; flex-direction: column; justify-content: center; padding: 0 34px;
  }
  .top { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .top img { width: 60px; height: 60px; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.25); outline: 2px solid rgba(255,255,255,.6); }
  h1 { font-size: 25px; line-height: 1.25; font-weight: 800; }
  .free { display: inline-block; background: #fff; color: #b30000; font-weight: 800; font-size: 19px; padding: 6px 14px; border-radius: 999px; margin-bottom: 12px; align-self: flex-start; }
  p { font-size: 15px; opacity: .92; }
</style>
</head>
<body>
  <div class="top"><img src="/icons/icon-128.png" alt=""><h1 id="name"></h1></div>
  <span class="free" id="free"></span>
  <p id="sub"></p>
<script>
  const lang = new URLSearchParams(location.search).get('lang') || 'ko';
  const t = {
    ko: ['구독 내보내기·가져오기<br>(YouTube용)', '진짜로 무료입니다', '광고 없음 · 서버 없음 · 개인정보 수집 없음'],
    en: ['Subscription Transfer<br>for YouTube', 'Truly free', 'No ads · No server · No data collected'],
  }[lang];
  document.getElementById('name').innerHTML = t[0];
  document.getElementById('free').textContent = t[1];
  document.getElementById('sub').textContent = t[2];
</script>
</body>
</html>

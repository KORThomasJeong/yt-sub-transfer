<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1 data-i18n="extName"></h1>
    <p id="status" class="status"></p>
    <button id="open-yt" class="secondary" hidden data-i18n="openYouTube"></button>
  </header>

  <section id="export-section">
    <h2 data-i18n="exportTitle"></h2>
    <p class="hint" data-i18n="exportHint"></p>
    <div class="row">
      <button id="export-json" data-i18n="exportJson"></button>
      <button id="export-csv" data-i18n="exportCsv"></button>
    </div>
    <p id="export-result" class="result"></p>
  </section>

  <section id="import-section">
    <h2 data-i18n="importTitle"></h2>
    <p class="hint" data-i18n="importHint"></p>
    <input id="file" type="file" accept=".json,.csv,.txt,application/json,text/csv,text/plain">
    <p id="file-info" class="result"></p>
    <label class="delay">
      <span data-i18n="delayLabel"></span>
      <input id="delay" type="number" min="0.5" max="30" step="0.5" value="2">
    </label>
    <div class="row">
      <button id="import-start" disabled data-i18n="importStart"></button>
      <button id="import-stop" class="secondary" hidden data-i18n="importStop"></button>
    </div>
    <div id="progress" hidden>
      <progress id="bar" max="1" value="0"></progress>
      <p id="progress-text" class="result"></p>
      <button id="download-failed" class="secondary" hidden data-i18n="downloadFailed"></button>
    </div>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
